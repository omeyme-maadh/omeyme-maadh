<svg width="1600" height="400" viewBox="0 0 1600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="goldGlow" cx="85%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#c9a227" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="8%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#4f7cff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#4f7cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ruleFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a227" stop-opacity="1"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="400" fill="#0a0a0c"/>
  <rect width="1600" height="400" fill="url(#grid)"/>
  <rect width="1600" height="400" fill="url(#goldGlow)"/>
  <rect width="1600" height="400" fill="url(#blueGlow)"/>

  <!-- eyebrow -->
  <text x="100" y="128" font-family="Consolas, 'JetBrains Mono', monospace" font-size="15" letter-spacing="4" fill="#c9a227">STUDENT PROFILE — FST · UNIVERSITÉ DE NOUAKCHOTT</text>
  <line x1="100" y1="142" x2="164" y2="142" stroke="#c9a227" stroke-width="1.5"/>

  <!-- name -->
  <text x="98" y="220" font-family="Helvetica, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-1" fill="#f5f5f7">Omeyme Cherif Ahmed</text>

  <!-- tagline -->
  <text x="100" y="264" font-family="Consolas, 'JetBrains Mono', monospace" font-size="17" fill="#98989f">Computer Science Student &#183; Business Information Systems &#183; Future AI Engineer</text>

  <!-- rule -->
  <rect x="100" y="292" width="420" height="2" fill="url(#ruleFade)"/>

  <!-- degree line -->
  <text x="100" y="330" font-family="Consolas, 'JetBrains Mono', monospace" font-size="13" letter-spacing="1" fill="#5c5c63">MIAGE — INFORMATIQUE APPLIQUÉE À LA GESTION D'ENTREPRISE</text>

  <!-- corner ID motif -->
  <g transform="translate(1360,60)">
    <rect x="0" y="0" width="150" height="150" rx="18" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.09)"/>
    <text x="18" y="30" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#5c5c63">DIGITAL ID</text>
    <text x="18" y="60" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f5f5f7">O.C.A.</text>
    <text x="18" y="80" font-family="Consolas, monospace" font-size="9" fill="#98989f">MIAGE &#183; FST</text>
    <g transform="translate(18,100)">
      <!-- decorative dot grid -->
      <g fill="rgba(255,255,255,0.16)">
        <rect x="0" y="0" width="6" height="6"/><rect x="12" y="0" width="6" height="6"/><rect x="36" y="0" width="6" height="6"/>
        <rect x="6" y="10" width="6" height="6"/><rect x="24" y="10" width="6" height="6"/><rect x="30" y="10" width="6" height="6"/>
        <rect x="0" y="20" width="6" height="6"/><rect x="18" y="20" width="6" height="6"/><rect x="36" y="20" width="6" height="6"/>
      </g>
    </g>
    <text x="18" y="138" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#c9a227">VERIFIED</text>
  </g>
</svg>
