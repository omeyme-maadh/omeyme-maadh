<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="30%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#4f7cff"/>
    </linearGradient>
  </defs>

  <rect width="500" height="500" fill="url(#bg)"/>

  <!-- outer ring -->
  <circle cx="250" cy="250" r="190" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-opacity="0.55"/>
  <circle cx="250" cy="250" r="205" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- monogram -->
  <text x="250" y="288" font-family="Helvetica, Arial, sans-serif" font-size="150" font-weight="700"
        text-anchor="middle" fill="#f5f5f7" letter-spacing="-4">OA</text>

  <!-- gold underline accent -->
  <rect x="178" y="315" width="144" height="4" rx="2" fill="#c9a227"/>

  <!-- tick marks around the ring, like a dial / credential seal -->
  <g stroke="#98989f" stroke-opacity="0.5" stroke-width="2">
    <line x1="250" y1="52" x2="250" y2="70"/>
    <line x1="250" y1="430" x2="250" y2="448"/>
    <line x1="52" y1="250" x2="70" y2="250"/>
    <line x1="430" y1="250" x2="448" y2="250"/>
  </g>

  <!-- corner dot accent, echoes the ID-card motif -->
  <g fill="#4f7cff" fill-opacity="0.7">
    <circle cx="130" cy="130" r="3.5"/>
    <circle cx="370" cy="370" r="3.5"/>
  </g>
</svg>
